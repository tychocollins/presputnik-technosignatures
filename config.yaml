# Phase 1 Feasibility Configuration: Pre-Sputnik Earth-Shadow Test

cutoffs:
  sputnik_utc: "1957-10-04T00:00:00"
  sun_alt_max_deg: -12.0  # Nautical twilight threshold

geometry:
  altitudes_km:
    default: 42164.0  # Geostationary geocentric radius (r_GEO)
    sensitivity:
      - 36000.0
      - 20000.0
  spatial_grid_step_deg: 0.25
  min_spatial_samples_per_axis: 5
  time_step_minutes: 10.0  # exposures > 10 min get intermediate time steps

tiers:
  tier_a:
    max_center_sep_field_radius_frac: 0.5
    min_dt_minutes: 5.0
    max_dt_hours: 24.0

power:
  transient_density_min_per_deg2: 0.01
  transient_density_max_per_deg2: 10.0
  transient_density_num_points: 25
  overdispersion_factor: 2.0

go_no_go:
  min_poss1_shadow_exposure_ratio: 1.0
  min_tier_a_fully_in_shadow: 30
  min_tier_a_instruments: 3

data_sources:
  applause_tap_url: "https://www.plate-archive.org/tap"
  dasch_tap_url: "http://dc.g-vo.org/tap"
  poss1_vizier_catalog: "VI/25"
  rate_limit_seconds: 1.0
