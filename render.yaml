services:
  - type: worker
    name: phase2b-worker
    runtime: docker
    region: virginia
    plan: pro_plus
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    disk:
      name: phase2b-data
      mountPath: /data
      sizeGB: 25
    envVars:
      - key: OUTPUT_DIR
        value: /data
      - key: MAX_WORKERS
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
